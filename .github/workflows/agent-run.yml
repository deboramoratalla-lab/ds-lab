# Seamline runs on its own every morning: certify, let Nemotron repair what it's sure of, open the ds-sync PR,
# refresh the console data. Needs repo secrets NEBIUS_API_KEY (Token Factory) and TAVILY_API_KEY.
name: agent-run
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write, actions: write, issues: write }
concurrency: { group: agent-run, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: bash fixtures/get-primer.sh
      - name: Check the Token Factory key (stop instead of publishing a degraded run)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://api.tokenfactory.nebius.com/v1/models -H "Authorization: Bearer $NEBIUS_API_KEY")
          K="$NEBIUS_API_KEY"; T=$(printf %s "$K" | tr -d ' \r\n"'"'"'')
          echo "key length ${#K} (trimmed ${#T}), starts with ${T:0:3}, has whitespace: $([ "$K" != "$(printf %s "$K" | tr -d ' \r\n\t')" ] && echo yes || echo no)"
          [ "$code" = "200" ] || code=$(curl -s -o /dev/null -w "%{http_code}" https://api.tokenfactory.nebius.com/v1/models -H "Authorization: Bearer $T")
          [ "$code" = "200" ] || { echo "::error::Token Factory said $code. Check the NEBIUS_API_KEY secret (paste the key only, no quotes or spaces)."; exit 1; }
          echo "NEBIUS_API_KEY=$T" >> $GITHUB_ENV
      - name: Agent run (Nemotron on Token Factory)
        run: npx tsx src/console/export.ts
      - name: Check every component
        run: npx tsx src/certify-catalog.ts && node scripts/gap-tasks-sync.mjs && (npx tsx src/review-screens.ts || echo "meaning review skipped") && npx tsx src/certify-screens.ts && npx tsx src/triage-catalog.ts
      - name: Unit tests, including that every number in the console agrees
        run: node scripts/test-summary.mjs
      - run: node console/build.mjs
      - name: Save the run
        run: |
          git config user.name "seamline-agent"; git config user.email "seamline-agent@users.noreply.github.com"
          git add console/data.json console/catalog.json console/catalog-triage.json console/screens.json console/screens-review.json console/gap-tasks.json console/tests.json console/index.html README.md
          git commit -m "agent-run: $(date -u +%F) certification and repair" || echo "nothing new"
          git pull --rebase -X theirs origin main && git push origin HEAD:main
      - name: Open the ds-sync pull request
        run: |
          npx tsx src/cli.ts pr --open
          # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows (GitHub holds them as "action required"),
          # so the agent starts the ds-sync check on the PR branch itself.
          BR=$(git ls-remote --heads origin 'ds-sync/*' | awk '{print $2}' | sed 's#refs/heads/##' | sort | tail -1)
          sleep 15
          for id in $(gh api "repos/${{ github.repository }}/actions/runs?branch=$BR&status=action_required" --jq '.workflow_runs[].id'); do
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve" && echo "approved ds-sync run $id" || echo "could not approve $id"
          done
          [ -n "$BR" ] && (gh workflow run ds-sync.yml --ref "$BR" && echo "started ds-sync on $BR" || echo "could not start ds-sync on $BR")
          git add console && (git commit -m "agent-run - link PR" && git pull --rebase -X theirs origin main && git push origin HEAD:main || true)
