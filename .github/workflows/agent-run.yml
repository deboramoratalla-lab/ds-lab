# Seamline runs on its own every morning: certify, let Nemotron repair what it's sure of, open the ds-sync PR,
# refresh the console data. Needs repo secrets NEBIUS_API_KEY (Token Factory) and TAVILY_API_KEY.
name: agent-run
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
concurrency: { group: agent-run, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: bash fixtures/get-primer.sh
      - name: Agent run (Nemotron on Token Factory)
        run: npx tsx src/console/export.ts
      - name: Check every component
        run: npx tsx src/certify-catalog.ts && npx tsx src/triage-catalog.ts
      - run: node console/build.mjs
      - name: Save the run
        run: |
          git config user.name "seamline-agent"; git config user.email "seamline-agent@users.noreply.github.com"
          git add console/data.json console/catalog.json console/catalog-triage.json console/index.html
          git commit -m "agent-run: $(date -u +%F) certification and repair" || echo "nothing new"
          git push origin HEAD:main
      - name: Open the ds-sync pull request
        run: |
          npx tsx src/cli.ts pr --open
          git add console && (git commit -m "agent-run - link PR" && git push origin HEAD:main || true)
